name: scrape

on:
  workflow_dispatch:
  schedule:
    # Once a day at 21:30 America/Denver, late enough to pick up results
    # entered after the evening fixtures. GitHub crons are UTC and the whole
    # Aug-Oct season is MDT (UTC-6) -- DST does not end until Nov 1, after the
    # last fixture -- so 03:30 UTC is 21:30 MT the previous evening.
    #
    # Manual runs: the page footer links here, and workflow_dispatch above
    # means anyone with write access can trigger one on demand.
    - cron: '30 3 * * *'

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

env:
  # First fixture of the season. Scheduled runs before this date are skipped,
  # because there is nothing to collect yet; manual runs always go through.
  SEASON_OPENS: '2026-08-22' 

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Gate scheduled runs on the season opening
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run (${{ github.event_name }}) - proceeding"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(TZ=America/Denver date +%F)"
          if [[ "$today" < "$SEASON_OPENS" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Season opens $SEASON_OPENS; skipping scheduled run on $today"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true' 

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: '1.26'
          cache: true

      - name: Scrape and render
        if: steps.gate.outputs.run == 'true'
        run: go run ./cmd/scrape -out docs

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          # data.json carries a generatedAt stamp that changes every run, so
          # compare the rendered page's substance instead of just "is dirty".
          if git diff --quiet -- docs/; then
            echo "no changes"
            exit 0
          fi
          git config user.name  "uysa-standings bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
